# =============================================================================
# NetworkPolicy 리소스 정의
# =============================================================================
# 기본적으로 모든 ingress/egress를 차단하고, 필요한 트래픽만 허용
# 각 네임스페이스에 적용 필요:
#   - monitoring, observability, security, backup, vault, argocd 등
#
# 적용 방법:
#   kubectl apply -f templates/network-policies.yaml --context <cluster-context>
# =============================================================================

---
# Default Deny All Ingress/Egress (각 네임스페이스에 반복 적용)
# namespace 필드 없음 → kubectl apply -n <NS> 플래그로 대상 네임스페이스 지정
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow DNS (각 네임스페이스에 반복 적용)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow DNS queries to kube-system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# Allow Kubernetes API Access (각 네임스페이스에 반복 적용)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubernetes-api
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow access to Kubernetes API server
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              component: kube-apiserver
      ports:
        - protocol: TCP
          port: 6443
    # Allow access to API server via service
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443

---
# Monitoring Namespace - Allow Prometheus Scraping
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Grafana access
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow scraping metrics from all namespaces
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9091
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 9187

---
# Monitoring Namespace - Allow Grafana Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow external access
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow Prometheus access
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    # Allow Thanos access (observability namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9090

---
# Observability Namespace - Allow Thanos Receive
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-thanos-receive
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: receive
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus remote_write from all clusters
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 19291
  egress:
    # Allow MinIO access (backup namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backup
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 9000

---
# Backup Namespace - Allow MinIO Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio
  namespace: backup
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Velero access from all namespaces
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9000
    # Allow Thanos access
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9000
    # Allow console access
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9001

---
# Vault Namespace - Allow Vault API Access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-api
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow API access from all namespaces (for secrets injection)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
  egress:
    # Allow external PKI operations
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443

---
# Security Namespace - Allow Kyverno Webhooks
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kyverno-webhooks
  namespace: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kyverno
  policyTypes:
    - Ingress
  ingress:
    # Allow Kubernetes API server to call webhooks
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 9443

---
# Security Namespace - Allow Falco
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-falco
  namespace: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: falco
  policyTypes:
    - Egress
  egress:
    # Allow sending alerts to monitoring
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090

---
# ArgoCD Namespace - Allow ArgoCD Server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argocd-server
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow UI/API access
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8083
  egress:
    # Allow Git repository access
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 22
        - protocol: TCP
          port: 443
    # Allow Kubernetes API access
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 6443
