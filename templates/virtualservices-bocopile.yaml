# VirtualServices for *.bocopile.io domain routing
# Apply to mgmt cluster
---
# Grafana
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: grafana-vs
  namespace: monitoring
spec:
  hosts:
  - "grafana.bocopile.io"
  gateways:
  - istio-system/bocopile-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: kube-prometheus-stack-grafana
        port:
          number: 80
---
