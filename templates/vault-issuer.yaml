# =============================================================================
# Vault ClusterIssuer for cert-manager
# Phase 2 PKI: Vault를 인증서 발급 소스로 사용
# =============================================================================
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
spec:
  vault:
    # Vault 서버 주소 (mgmt 클러스터 내부)
    server: http://vault.vault.svc.cluster.local:8200

    # PKI Role 경로
    path: pki/sign/istio-gateway

    # Vault CA Bundle (base64 인코딩)
    # NOTE: scripts/setup-vault-pki.sh 실행 후 generated/vault-ca-cert.b64 내용으로 교체
    # caBundle: <base64-encoded-ca-cert>

    # Kubernetes Auth 설정
    auth:
      kubernetes:
        role: cert-manager
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: cert-manager
