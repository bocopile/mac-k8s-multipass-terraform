# External Secrets ClusterSecretStore
# Applied after ESO installation
# Purpose: Configure Vault backend for secret synchronization

---
# ClusterSecretStore for mgmt cluster (in-cluster Vault)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets

  # Refresh interval (C3: 1h cache for mgmt failure)
  refreshInterval: 1h

---
# Secret containing Vault token (created by install-eso.sh)
# This is a placeholder - actual token is generated during installation
# apiVersion: v1
# kind: Secret
# metadata:
#   name: vault-token
#   namespace: external-secrets
# type: Opaque
# stringData:
#   token: "hvs.xxxxxxxxxxxxx"

