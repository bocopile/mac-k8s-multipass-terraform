# ArgoCD Helm Values
# Chart: argo/argo-cd
# Purpose: GitOps continuous delivery

# Server configuration
server:
  service:
    type: ClusterIP
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

# Application Controller
controller:
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

# Repository Server
repoServer:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

# Redis
redis:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# Configuration
configs:
  params:
    # Disable TLS (insecure mode for local development)
    server.insecure: true
