# Loki Helm Values
# Chart: grafana/loki
# Purpose: Log aggregation and storage

# Deployment mode
deploymentMode: SingleBinary

# Single Binary configuration
singleBinary:
  replicas: 1

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

  persistence:
    storageClass: local-path-retain
    size: 10Gi

# Loki configuration
loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  limits_config:
    retention_period: 168h  # 7 days

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

# Disable distributed components (SingleBinary mode)
gateway:
  enabled: false

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

chunksCache:
  enabled: false

resultsCache:
  enabled: false
