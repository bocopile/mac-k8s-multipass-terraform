# OpenTelemetry Collector Helm Values
# Chart: open-telemetry/opentelemetry-collector
# Purpose: Unified observability data collection (metrics, logs, traces)

# Deployment mode
mode: daemonset  # or deployment for gateway mode

# Image
image:
  repository: otel/opentelemetry-collector-k8s
  tag: 0.96.0

# Config (receivers, processors, exporters, pipelines)
config:
  receivers:
    # OTLP receiver (default for OpenTelemetry)
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    # Prometheus receiver (scrape metrics)
    prometheus:
      config:
        scrape_configs:
          - job_name: 'otel-collector'
            scrape_interval: 30s
            static_configs:
              - targets: ['localhost:8888']

    # Kubernetes cluster receiver
    k8s_cluster:
      auth_type: serviceAccount
      node_conditions_to_report:
        - Ready
        - MemoryPressure

  processors:
    # Batch processor (recommended for production)
    batch:
      timeout: 10s
      send_batch_size: 1024

    # Memory limiter
    memory_limiter:
      check_interval: 5s
      limit_mib: 512
      spike_limit_mib: 128

    # Kubernetes attributes
    k8sattributes:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.pod.name
          - k8s.pod.uid

  exporters:
    # Prometheus exporter (for Prometheus to scrape)
    prometheus:
      endpoint: 0.0.0.0:8889

    # OTLP exporter (to Tempo for traces)
    otlp/tempo:
      endpoint: tempo.observability.svc:4317
      tls:
        insecure: true

    # Loki exporter (for logs)
    loki:
      endpoint: http://loki-gateway.observability.svc/loki/api/v1/push
      tenant_id: ""

    # Debug exporter (for testing)
    debug:
      verbosity: detailed

  service:
    pipelines:
      # Metrics pipeline
      metrics:
        receivers: [otlp, prometheus, k8s_cluster]
        processors: [memory_limiter, batch, k8sattributes]
        exporters: [prometheus]

      # Traces pipeline
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch, k8sattributes]
        exporters: [otlp/tempo]

      # Logs pipeline
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch, k8sattributes]
        exporters: [loki]

# Resources
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Ports
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

# ServiceMonitor
serviceMonitor:
  enabled: true

# Autoscaling (for deployment mode)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
